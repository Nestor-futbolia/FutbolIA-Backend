name: Sincronizar estadisticas historicas

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Iniciar backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "========================================"
          echo "INICIANDO BACKEND"
          echo "========================================"

          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

          SERVER_PID=$!

          sleep 5

          echo ""
          echo "=== LOG DEL BACKEND ==="
          cat server.log

          echo ""
          echo "=== HEALTH ==="

          curl -f http://127.0.0.1:8000/health

          echo ""
          echo "========================================"
          echo "INICIANDO SINCRONIZACION HISTORICA"
          echo "Liga: 140"
          echo "Temporada: 2024"
          echo "Lotes: 8"
          echo "Partidos por lote: 10"
          echo "Maximo teorico: 80 partidos"
          echo "========================================"

          TOTAL_PROCESSED=0
          TOTAL_FAILED=0

          for BATCH in 1 2 3 4 5 6 7 8
          do

            echo ""
            echo "========================================"
            echo "LOTE $BATCH DE 8"
            echo "========================================"

            HTTP_CODE=$(curl -s \
              -o response.json \
              -w "%{http_code}" \
              "http://127.0.0.1:8000/sync/statistics/batch?league=140&season=2024&limit=10")

            echo ""
            echo "CODIGO HTTP: $HTTP_CODE"

            echo ""
            echo "RESPUESTA:"
            cat response.json

            echo ""

            if [ "$HTTP_CODE" != "200" ]; then
              echo ""
              echo "ERROR EN EL LOTE $BATCH"
              echo "Se detiene la sincronizacion para proteger el limite de API."
              cat response.json
              kill $SERVER_PID || true
              exit 1
            fi

            PROCESSED=$(python -c 'import json; d=json.load(open("response.json")); print(d.get("processed", 0))')
            FAILED=$(python -c 'import json; d=json.load(open("response.json")); print(d.get("failed", 0))')
            PENDING=$(python -c 'import json; d=json.load(open("response.json")); print(d.get("pending_fixtures", 0))')

            TOTAL_PROCESSED=$((TOTAL_PROCESSED + PROCESSED))
            TOTAL_FAILED=$((TOTAL_FAILED + FAILED))

            echo ""
            echo "Procesados en este lote: $PROCESSED"
            echo "Fallidos en este lote: $FAILED"
            echo "Pendientes restantes: $PENDING"

            if [ "$PROCESSED" = "0" ]; then
              echo ""
              echo "No quedan partidos pendientes."
              break
            fi

            if [ "$BATCH" != "8" ]; then
              echo ""
              echo "Esperando antes del siguiente lote..."
              sleep 3
            fi

          done

          echo ""
          echo "========================================"
          echo "SINCRONIZACION TERMINADA"
          echo "========================================"
          echo "TOTAL PROCESADOS: $TOTAL_PROCESSED"
          echo "TOTAL FALLIDOS: $TOTAL_FAILED"
          echo "========================================"

          kill $SERVER_PID || true
