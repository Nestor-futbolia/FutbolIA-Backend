name: Sincronizar estadisticas por lote

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Iniciar backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "=== INICIANDO BACKEND ==="

          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

          SERVER_PID=$!

          sleep 5

          echo "=== LOG DEL BACKEND ==="
          cat server.log

          echo ""
          echo "=== HEALTH ==="

          curl -f http://127.0.0.1:8000/health

          echo ""
          echo "=== SINCRONIZANDO LOTE ==="
          echo "Liga: 140"
          echo "Temporada: 2024"
          echo "Límite: 5 partidos"

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            "http://127.0.0.1:8000/sync/statistics/batch?league=140&season=2024&limit=5")

          echo ""
          echo "=== CÓDIGO HTTP ==="
          echo "$HTTP_CODE"

          echo ""
          echo "=== RESPUESTA ==="
          cat response.json

          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "========================================"
            echo "LOTE SINCRONIZADO CORRECTAMENTE"
            echo "========================================"
            echo "API-FOOTBALL"
            echo "     ↓"
            echo "ESTADISTICAS"
            echo "     ↓"
            echo "BACKEND"
            echo "     ↓"
            echo "SUPABASE"
            echo "========================================"
          else
            echo "========================================"
            echo "ERROR EN EL LOTE"
            echo "========================================"
            exit 1
          fi

          kill $SERVER_PID || true
