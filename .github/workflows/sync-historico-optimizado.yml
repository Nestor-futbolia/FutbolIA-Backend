name: Sincronizar historial optimizado

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Lote de ligas: 0, 1, 2 o 3"
        required: true
        default: "0"
        type: string

      season:
        description: "Temporada: 2024, 2023 o 2022"
        required: true
        default: "2024"
        type: string

jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: |
          python -m pip install "requests>=2.31,<3"

      - name: Sincronizar historial
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

          LEAGUE_BATCH: ${{ inputs.batch }}
          HISTORICAL_SEASON: ${{ inputs.season }}

        run: |
          python app/sync_team_history.py
