name: Probar sincronización API-Football a Supabase

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Diagnosticar backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "=== INICIANDO UVICORN ==="

          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

          SERVER_PID=$!

          echo "PID DEL BACKEND: $SERVER_PID"

          sleep 5

          echo "=== PROCESO ==="
          ps aux | grep uvicorn || true

          echo "=== LOG COMPLETO DEL BACKEND ==="
          cat server.log || true

          echo "=== FIN DEL LOG ==="

          echo "=== PROBANDO PUERTO 8000 ==="
          curl -v http://127.0.0.1:8000/health || true

          echo "=== DIAGNOSTICO TERMINADO ==="
