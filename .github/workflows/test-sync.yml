name: Probar backend Fútbol IA

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar importación
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "=== PROBANDO IMPORTACION ==="
          python -c "from app.main import app; print('IMPORTACION OK')"

      - name: Probar backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "=== INICIANDO BACKEND ==="

          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

          SERVER_PID=$!

          echo "PID: $SERVER_PID"

          sleep 5

          echo "=== LOG DEL BACKEND ==="
          cat server.log

          echo "=== PROBANDO HEALTH ==="
          curl -f http://127.0.0.1:8000/health

          echo ""
          echo "========================================"
          echo "BACKEND FUNCIONA CORRECTAMENTE"
          echo "========================================"

          kill $SERVER_PID || true
