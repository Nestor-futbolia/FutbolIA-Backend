name: Probar sincronización API-Football a Supabase

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Iniciar backend y sincronizar
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "=== INICIANDO BACKEND ==="

          python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

          SERVER_PID=$!

          sleep 5

          echo "=== COMPROBANDO BACKEND ==="
          curl -f http://127.0.0.1:8000/health

          echo ""
          echo "=== SINCRONIZANDO LA LIGA ==="

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            "http://127.0.0.1:8000/sync/league?league=140&season=2025")

          echo "Código HTTP: $HTTP_CODE"

          echo "=== RESPUESTA ==="
          cat response.json

          echo ""
          echo "=== LOG DEL BACKEND ==="
          cat server.log

          if [ "$HTTP_CODE" = "200" ]; then
            echo ""
            echo "========================================"
            echo "SINCRONIZACION EXITOSA"
            echo "API-FOOTBALL -> BACKEND -> SUPABASE"
            echo "========================================"
          else
            echo ""
            echo "ERROR EN LA SINCRONIZACION"
            exit 1
          fi

          kill $SERVER_PID || true
