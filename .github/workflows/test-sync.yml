name: Probar sincronización API-Football a Supabase

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Iniciar backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          sleep 5

      - name: Sincronizar La Liga 2025
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            "http://127.0.0.1:8000/sync/league?league=140&season=2025")

          echo "$RESPONSE"

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1 | sed 's/HTTP_CODE://')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "SINCRONIZACION API-FOOTBALL -> SUPABASE OK"
          else
            echo "ERROR EN LA SINCRONIZACION"
            cat server.log
            exit 1
          fi
